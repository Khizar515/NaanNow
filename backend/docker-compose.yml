version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Maps your local code to the container for live-updating
      - .:/app
      # Prevents local node_modules from overwriting container's node_modules
      - /app/node_modules
    depends_on:
      - database
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/Naan_Now

  database:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      # Saves database data to a persistent local volume
      - mongo-data:/data/db

volumes:
  mongo-data: