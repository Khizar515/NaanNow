services:
  backend:
    build: ./backend
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - ./.env
    # ADDED VOLUMES: Map local backend folder to container /app folder
    volumes:
      - ./backend:/app
      - /app/node_modules # Prevents local node_modules from overwriting container's
    # ADDED COMMAND: Override standard start to use nodemon
    command: npm run dev
    # command: sh -c "node seed.js && npm run dev"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      # Because we want hot-reload, we MUST use the Vite dev server, not Nginx
      dockerfile: Dockerfile.dev 
    ports:
      - "3001:5173" # Vite's default port is 5173
    env_file:
      - ./.env
    # ADDED VOLUMES: Map local frontend folder to container /app folder
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./.env:/.env:ro
    environment:
      - CHOKIDAR_USEPOLLING=true # Helps Vite detect file changes on Windows via Docker
    depends_on:
      - backend

  mongo:
    build: ./Database_backup
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: